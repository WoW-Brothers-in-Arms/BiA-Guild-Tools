# Builds BiAGuildTools-<version>.zip and publishes a GitHub release when a tag like v1.2.3 is pushed.
# WowUp ("Install from URL") and other addon managers download the zip from the latest release.
# release.json tells WowUp the zip is for both Retail ("mainline") and WoW: Forever ("forever");
# without it WowUp only offers a zip to Forever when its name ends in -forever.zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the TOC version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          toc=$(sed -n 's/^## Version: *//p' BiAGuildTools/BiAGuildTools.toc | tr -d '\r')
          if [ "$tag" != "$toc" ]; then
            echo "::error::Tag v$tag does not match '## Version: $toc' in BiAGuildTools.toc"
            exit 1
          fi
          echo "VERSION=$tag" >> "$GITHUB_ENV"

      - name: Take the release notes from CHANGELOG.md
        run: |
          .github/changelog-section.sh "$VERSION" > changelog.md
          cat changelog.md

      - name: Build zip (contains only the BiAGuildTools folder) and release.json
        run: |
          git archive --format=zip -o "BiAGuildTools-$VERSION.zip" HEAD BiAGuildTools
          .github/release-json.sh "$GITHUB_REF_NAME" "BiAGuildTools-$VERSION.zip" > release.json
          cat release.json

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "BiAGuildTools-$VERSION.zip" release.json \
            --title "BiA Guild Tools $VERSION" --notes-file changelog.md

      # Needs the secret CF_API_KEY (curseforge.com → Account → API Tokens) and the repository
      # variable CF_PROJECT_ID (CurseForge project page → "About Project"). Skipped while either is missing.
      - name: Upload to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          CF_PROJECT_ID: ${{ vars.CF_PROJECT_ID }}
        run: |
          if [ -z "$CF_API_KEY" ] || [ -z "$CF_PROJECT_ID" ]; then
            echo "::notice::CF_API_KEY or CF_PROJECT_ID not set, skipping the CurseForge upload"
            exit 0
          fi
          .github/curseforge-upload.sh "$GITHUB_REF_NAME" "BiAGuildTools-$VERSION.zip" changelog.md
